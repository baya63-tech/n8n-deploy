name: Build and deploy (ghcr + kind)

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/baya63-tech/n8n-deploy

jobs:
  build-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t $IMAGE:${{ github.sha }} .

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image to ghcr.io
        run: docker push $IMAGE:${{ github.sha }}

      - name: Create kind cluster
        uses: helm/kind-action@v1

      - name: Load image into kind
        run: kind load docker-image $IMAGE:${{ github.sha }}

      - name: Deploy to kind
        run: |
          sed -i "s|bayachacr.azurecr.io/n8n:latest|$IMAGE:${{ github.sha }}|" kubernetes/n8n-deployment.yml
          kubectl apply -f kubernetes/n8n-deployment.yml
          kubectl rollout status deployment/n8n --timeout=180s
          kubectl get pods